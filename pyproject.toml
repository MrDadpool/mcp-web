[project]
name = "mcp-web"
version = "0.1.0"
description = "MCP server giving local LLMs web search, page fetching, HTTP, and headless rendering"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
    "ddgs>=9.0",
    "trafilatura>=1.12",
]

[project.optional-dependencies]
browser = ["playwright>=1.47"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[project.scripts]
mcp-web = "mcp_web.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_web"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
